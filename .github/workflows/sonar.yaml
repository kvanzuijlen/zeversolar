name: SonarQube
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download CI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ci-artifacts
          path: ci-artifacts

      - name: Read PR Info
        id: pr-info
        run: |
          if [ -f ci-artifacts/pr-number.txt ]; then
            echo "pr_number=$(cat ci-artifacts/pr-number.txt)" >> $GITHUB_OUTPUT
            echo "pr_base=$(cat ci-artifacts/pr-base.txt)" >> $GITHUB_OUTPUT
            echo "pr_head=$(cat ci-artifacts/pr-head.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Move coverage to root
        run: cp ci-artifacts/coverage.xml .

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            ${{ steps.pr-info.outputs.pr_number && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', steps.pr-info.outputs.pr_number, steps.pr-info.outputs.pr_head, steps.pr-info.outputs.pr_base) || '' }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
